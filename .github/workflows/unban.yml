name: Unban IP

# One-off, manually-triggered helper to clear a fail2ban ban from the prod
# server using the (non-banned) GitHub Actions runner. Does NOT touch Tomcat or
# deploy anything.
on:
  workflow_dispatch:
    inputs:
      ip:
        description: "IP address to unban"
        required: true
        default: "193.62.205.85"

jobs:
  unban:
    runs-on: ubuntu-latest
    environment: SKINDB
    steps:
      - name: Unban
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            IP="${{ github.event.inputs.ip }}"
            echo "Unbanning $IP from all fail2ban jails"
            fail2ban-client unban "$IP" 2>/dev/null || true
            fail2ban-client set sshd unbanip "$IP" 2>/dev/null || true
            fail2ban-client set recidive unbanip "$IP" 2>/dev/null || true
            echo "--- sshd jail status ---"
            fail2ban-client status sshd 2>/dev/null | tail -8 || true
            echo "Done."
