name: Deploy

on:
  push:
    branches: [ "main" ]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: SKINDB
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Build
        run: |
          chmod +x mvnw
          ./mvnw -DskipTests package

      - name: Upload
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "target/*.war"
          target: "/tmp/scsaid-${{ github.sha }}"

      - name: Activate
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            DEPLOY_DIR=/tmp/scsaid-${{ github.sha }}
            WAR=$(ls "$DEPLOY_DIR"/target/*.war | head -n1)
            # Stop via systemd so the next start runs as the 'tomcat' user —
            # keeps webapps/work/temp owned by tomcat and avoids root-owned files
            # that break later restarts.
            #
            # IMPORTANT: do NOT `pkill -f catalina` here. appleboy/ssh-action runs
            # this script via `bash -c "<script text>"`, so the literal word
            # "catalina" appears in this session's own command line; `pkill -f
            # catalina` then kills its OWN SSH session (SIGKILL/137) right after
            # the stop above and before the start below — stopping Tomcat and
            # stranding the site DOWN. `systemctl stop` already terminates the
            # service cleanly, so the pkill is both unnecessary and dangerous.
            systemctl stop tomcat 2>/dev/null || true
            # Wait for port 8080 to actually be released before starting, else the
            # new JVM hits BindException and dies silently.
            for i in $(seq 1 20); do ss -tln | grep -q ':8080 ' || break; sleep 1; done
            # Persist mutable runtime state outside the replaced WAR. On the
            # first deployment after this fix, migrate the live counter written
            # by the old application before deleting its exploded directory.
            COUNTER_DIR=/opt/SkinDB/runtime
            COUNTER_FILE="$COUNTER_DIR/access-counter.properties"
            TRAFFIC_FILE="$COUNTER_DIR/traffic-history.properties"
            COUNTRY_TRAFFIC_FILE="$COUNTER_DIR/country-traffic.properties"
            GEOIP_DATABASE="$COUNTER_DIR/GeoLite2-City.mmdb"
            OLD_GEOIP_DATABASE=/opt/tomcat/webapps/ROOT/WEB-INF/GeoLite2-City.mmdb
            OLD_COUNTER=/opt/tomcat/webapps/ROOT/WEB-INF/counter.properties
            install -d -o tomcat -g tomcat "$COUNTER_DIR"
            if [ ! -f "$COUNTER_FILE" ] && [ -f "$OLD_COUNTER" ]; then
              cp "$OLD_COUNTER" "$COUNTER_FILE"
            fi
            if [ ! -f "$COUNTER_FILE" ]; then
              printf 'currentDate=%s\ndailyCount=0\ntotalCount=0\n' "$(date +%F)" > "$COUNTER_FILE"
            fi
            if [ ! -f "$TRAFFIC_FILE" ]; then
              touch "$TRAFFIC_FILE"
            fi
            if [ ! -f "$COUNTRY_TRAFFIC_FILE" ]; then
              touch "$COUNTRY_TRAFFIC_FILE"
            fi
            # Keep the local GeoLite database outside the replaced WAR. It is
            # used only transiently to aggregate country counts; raw IPs are
            # never saved in the application analytics store.
            if [ ! -f "$GEOIP_DATABASE" ] && [ -f "$OLD_GEOIP_DATABASE" ]; then
              cp "$OLD_GEOIP_DATABASE" "$GEOIP_DATABASE"
            fi
            chown tomcat:tomcat "$COUNTER_FILE" "$TRAFFIC_FILE" "$COUNTRY_TRAFFIC_FILE"
            chmod 640 "$COUNTER_FILE" "$TRAFFIC_FILE" "$COUNTRY_TRAFFIC_FILE"
            if [ -f "$GEOIP_DATABASE" ]; then
              chown tomcat:tomcat "$GEOIP_DATABASE"
              chmod 640 "$GEOIP_DATABASE"
            else
              echo "Local GeoLite database missing; country analytics will report Unknown until it is restored."
            fi
            # Clear old app, compiled-JSP cache and stale PID before swapping in.
            rm -rf /opt/tomcat/webapps/ROOT \
                   /opt/tomcat/webapps/ROOT.war \
                   /opt/tomcat/work/Catalina/localhost/ROOT \
                   /opt/tomcat/temp/tomcat.pid
            mv "$WAR" /opt/tomcat/webapps/ROOT.war
            chown tomcat:tomcat /opt/tomcat/webapps/ROOT.war
            systemctl reset-failed tomcat 2>/dev/null || true
            systemctl start tomcat
            # Fail the deploy loudly if the app does not actually come up.
            ok=
            for i in $(seq 1 30); do
              if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "200" ]; then ok=1; break; fi
              sleep 3
            done
            if [ -z "$ok" ]; then
              echo "Tomcat did not return 200 after deploy"; tail -40 /opt/tomcat/logs/catalina.out || true; exit 1
            fi
            echo "Deploy OK: Tomcat serving on 8080"
