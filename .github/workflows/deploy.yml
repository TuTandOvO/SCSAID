name: Deploy

on:
  push:
    branches: [ "main" ]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: SKINDB
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Build
        run: |
          chmod +x mvnw
          ./mvnw -DskipTests package

      - name: Upload
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "target/*.war"
          target: "/tmp/scsaid-${{ github.sha }}"

      - name: Activate
        uses: appleboy/ssh-action@v1.0.3
        env:
          SCSAID_ANALYTICS_USER: ${{ secrets.SCSAID_ANALYTICS_USER }}
          SCSAID_ANALYTICS_PASSWORD: ${{ secrets.SCSAID_ANALYTICS_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: SCSAID_ANALYTICS_USER,SCSAID_ANALYTICS_PASSWORD
          script: |
            set -e
            DEPLOY_DIR=/tmp/scsaid-${{ github.sha }}
            WAR=$(ls "$DEPLOY_DIR"/target/*.war | head -n1)
            SCSAID_PYTHON=/opt/miniconda3/envs/scrna/bin/python
            if [ ! -x "$SCSAID_PYTHON" ]; then
              SCSAID_PYTHON=/root/miniconda3/envs/scrna/bin/python
            fi
            if [ ! -x "$SCSAID_PYTHON" ]; then
              echo "scSAID Python environment is unavailable"; exit 1
            fi
            # Full papers and sample-resolution indexes are private deployment
            # data. Refuse to activate a WAR that would silently fall back to
            # abstracts or a study-level publication match.
            LITERATURE_ROOT=/srv/scsaid-literature
            LITERATURE_VERIFY="$LITERATURE_ROOT/tools/verify_runtime_context.py"
            CORPUS_VERIFY="$LITERATURE_ROOT/tools/verify_corpus.py"
            test -r "$LITERATURE_ROOT/text/manifest.tsv"
            test -r "$LITERATURE_ROOT/papers/manifest.tsv"
            test -r "$LITERATURE_ROOT/index/papers.tsv"
            test -r "$LITERATURE_ROOT/index/sample_context.json"
            test -r "$LITERATURE_ROOT/index/canonical_sample_papers.json"
            "$SCSAID_PYTHON" "$CORPUS_VERIFY" \
              --registry "$LITERATURE_ROOT/index/papers.tsv" \
              --corpus "$LITERATURE_ROOT/papers" \
              --expect-downloaded 56
            "$SCSAID_PYTHON" "$LITERATURE_VERIFY" \
              --root "$LITERATURE_ROOT" \
              --registry "$LITERATURE_ROOT/index/registry.json" \
              --samples "$LITERATURE_ROOT/index/sample_context.json" \
              --selection "$LITERATURE_ROOT/index/canonical_sample_papers.json"
            # Keep the public metadata counts aligned with the post-QC cells
            # used by the Cell Proportion analysis. This runs before Tomcat is
            # stopped and replaces each CSV atomically.
            unzip -p "$WAR" WEB-INF/services/sync_post_qc_cell_counts.py | "$SCSAID_PYTHON" - /opt/SkinDB
            # Private country dashboard credentials are generated only on the
            # server. They are never committed, printed by CI, or returned by
            # the site. The root-only copy is the recovery path for the site
            # owner if browser credentials are lost.
            ANALYTICS_DIR=/etc/scsaid
            ANALYTICS_ENV="$ANALYTICS_DIR/private-analytics.env"
            ANALYTICS_DROPIN=/etc/systemd/system/tomcat.service.d/70-private-analytics.conf
            LITERATURE_DROPIN=/etc/systemd/system/tomcat.service.d/80-private-literature.conf
            install -d -m 0750 "$ANALYTICS_DIR" /etc/systemd/system/tomcat.service.d
            if [ -n "${SCSAID_ANALYTICS_USER:-}" ] && [ -n "${SCSAID_ANALYTICS_PASSWORD:-}" ]; then
              printf 'SCSAID_ANALYTICS_USER=%s\nSCSAID_ANALYTICS_PASSWORD=%s\n' "$SCSAID_ANALYTICS_USER" "$SCSAID_ANALYTICS_PASSWORD" > "$ANALYTICS_ENV"
              cp "$ANALYTICS_ENV" /root/scsaid-private-analytics-credentials.txt
              chmod 0600 /root/scsaid-private-analytics-credentials.txt
            elif [ ! -f "$ANALYTICS_ENV" ]; then
              ANALYTICS_PASSWORD=$(openssl rand -hex 32)
              printf 'SCSAID_ANALYTICS_USER=scsaid-developer\nSCSAID_ANALYTICS_PASSWORD=%s\n' "$ANALYTICS_PASSWORD" > "$ANALYTICS_ENV"
              cp "$ANALYTICS_ENV" /root/scsaid-private-analytics-credentials.txt
              chmod 0600 /root/scsaid-private-analytics-credentials.txt
            fi
            chown root:tomcat "$ANALYTICS_ENV"
            chmod 0640 "$ANALYTICS_ENV"
            printf '[Service]\nEnvironmentFile=%s\n' "$ANALYTICS_ENV" > "$ANALYTICS_DROPIN"
            chmod 0644 "$ANALYTICS_DROPIN"
            printf '[Service]\nEnvironment=SCSAID_LITERATURE_ROOT=/srv/scsaid-literature\n' > "$LITERATURE_DROPIN"
            chmod 0644 "$LITERATURE_DROPIN"
            systemctl daemon-reload
            # Nginx logs operational fields for this site but omits client IP
            # addresses and user-agent strings. Existing historical logs are
            # deliberately not altered by a deployment.
            NGINX_LOG_FORMAT=/etc/nginx/conf.d/scsaid-privacy-log.conf
            if [ ! -f "$NGINX_LOG_FORMAT" ]; then
              printf '%s\n' "log_format scsaid_privacy '\$time_iso8601 \$server_name \"\$request\" \$status \$body_bytes_sent \$request_time';" > "$NGINX_LOG_FORMAT"
            fi
            if ! grep -qF 'access_log /var/log/nginx/scsaid-access.log scsaid_privacy;' /etc/nginx/sites-available/skin-scsaid; then
              cp -p /etc/nginx/sites-available/skin-scsaid /etc/nginx/sites-available/skin-scsaid.before-private-analytics
              sed -i '/server_name skin-scsaid.com www.skin-scsaid.com;/a\    access_log /var/log/nginx/scsaid-access.log scsaid_privacy;' /etc/nginx/sites-available/skin-scsaid
            fi
            # The public TLS endpoint is reached through a trusted local proxy.
            # Restore the public address from that proxy's X-Forwarded-For chain
            # before passing it to Tomcat as X-Real-IP. This is safe because
            # nginx itself only accepts this upstream path on loopback.
            if ! grep -qF 'real_ip_header X-Forwarded-For;' /etc/nginx/sites-available/skin-scsaid; then
              cp -p /etc/nginx/sites-available/skin-scsaid /etc/nginx/sites-available/skin-scsaid.before-real-ip
              sed -i '/server_name skin-scsaid.com www.skin-scsaid.com;/a\    set_real_ip_from 127.0.0.1;\n    real_ip_header X-Forwarded-For;\n    real_ip_recursive on;' /etc/nginx/sites-available/skin-scsaid
            fi
            nginx -t
            systemctl reload nginx
            # Stop via systemd so the next start runs as the 'tomcat' user —
            # keeps webapps/work/temp owned by tomcat and avoids root-owned files
            # that break later restarts.
            #
            # IMPORTANT: do NOT `pkill -f catalina` here. appleboy/ssh-action runs
            # this script via `bash -c "<script text>"`, so the literal word
            # "catalina" appears in this session's own command line; `pkill -f
            # catalina` then kills its OWN SSH session (SIGKILL/137) right after
            # the stop above and before the start below — stopping Tomcat and
            # stranding the site DOWN. `systemctl stop` already terminates the
            # service cleanly, so the pkill is both unnecessary and dangerous.
            systemctl stop tomcat 2>/dev/null || true
            # Wait for port 8080 to actually be released before starting, else the
            # new JVM hits BindException and dies silently.
            for i in $(seq 1 20); do ss -tln | grep -q ':8080 ' || break; sleep 1; done
            # Persist mutable runtime state outside the replaced WAR. On the
            # first deployment after this fix, migrate the live counter written
            # by the old application before deleting its exploded directory.
            COUNTER_DIR=/opt/SkinDB/runtime
            COUNTER_FILE="$COUNTER_DIR/access-counter.properties"
            TRAFFIC_FILE="$COUNTER_DIR/traffic-history.properties"
            COUNTRY_TRAFFIC_FILE="$COUNTER_DIR/country-traffic.properties"
            DEVELOPER_VISITOR_FILE="$COUNTER_DIR/developer-visitor-addresses.properties"
            DEVELOPER_VISIT_EVENTS_FILE="$COUNTER_DIR/developer-visit-events.tsv"
            GEOIP_DATABASE="$COUNTER_DIR/GeoLite2-City.mmdb"
            OLD_GEOIP_DATABASE=/opt/tomcat/webapps/ROOT/WEB-INF/GeoLite2-City.mmdb
            LEGACY_GEOIP_DATABASE=/opt/tomcat/webapps/ROOT.colleague_0619_exploded/WEB-INF/GeoLite2-City.mmdb
            OLD_COUNTER=/opt/tomcat/webapps/ROOT/WEB-INF/counter.properties
            install -d -o tomcat -g tomcat "$COUNTER_DIR"
            if [ ! -f "$COUNTER_FILE" ] && [ -f "$OLD_COUNTER" ]; then
              cp "$OLD_COUNTER" "$COUNTER_FILE"
            fi
            if [ ! -f "$COUNTER_FILE" ]; then
              printf 'currentDate=%s\ndailyCount=0\ntotalCount=0\n' "$(date +%F)" > "$COUNTER_FILE"
            fi
            if [ ! -f "$TRAFFIC_FILE" ]; then
              touch "$TRAFFIC_FILE"
            fi
            if [ ! -f "$COUNTRY_TRAFFIC_FILE" ]; then
              touch "$COUNTRY_TRAFFIC_FILE"
            fi
            if [ ! -f "$DEVELOPER_VISITOR_FILE" ]; then
              touch "$DEVELOPER_VISITOR_FILE"
            fi
            if [ ! -f "$DEVELOPER_VISIT_EVENTS_FILE" ]; then
              touch "$DEVELOPER_VISIT_EVENTS_FILE"
            fi
            # Keep the local GeoLite database outside the replaced WAR. It is
            # used only for country resolution. The separate address history is
            # restricted to the authenticated developer analytics endpoint.
            if [ ! -f "$GEOIP_DATABASE" ] && [ -f "$OLD_GEOIP_DATABASE" ]; then
              cp "$OLD_GEOIP_DATABASE" "$GEOIP_DATABASE"
            fi
            if [ ! -f "$GEOIP_DATABASE" ] && [ -f "$LEGACY_GEOIP_DATABASE" ]; then
              cp "$LEGACY_GEOIP_DATABASE" "$GEOIP_DATABASE"
            fi
            chown tomcat:tomcat "$COUNTER_FILE" "$TRAFFIC_FILE" "$COUNTRY_TRAFFIC_FILE" "$DEVELOPER_VISITOR_FILE" "$DEVELOPER_VISIT_EVENTS_FILE"
            chmod 640 "$COUNTER_FILE" "$TRAFFIC_FILE" "$COUNTRY_TRAFFIC_FILE" "$DEVELOPER_VISITOR_FILE" "$DEVELOPER_VISIT_EVENTS_FILE"
            for state_file in "$COUNTER_FILE" "$TRAFFIC_FILE" "$COUNTRY_TRAFFIC_FILE" "$DEVELOPER_VISITOR_FILE" "$DEVELOPER_VISIT_EVENTS_FILE"; do
              runuser -u tomcat -- test -r "$state_file"
              runuser -u tomcat -- test -w "$state_file"
            done
            if [ -f "$GEOIP_DATABASE" ]; then
              chown tomcat:tomcat "$GEOIP_DATABASE"
              chmod 640 "$GEOIP_DATABASE"
            else
              echo "Local GeoLite database missing; country analytics will report Unknown until it is restored."
            fi
            # Clear old app, compiled-JSP cache and stale PID before swapping in.
            rm -rf /opt/tomcat/webapps/ROOT \
                   /opt/tomcat/webapps/ROOT.war \
                   /opt/tomcat/work/Catalina/localhost/ROOT \
                   /opt/tomcat/temp/tomcat.pid
            mv "$WAR" /opt/tomcat/webapps/ROOT.war
            chown tomcat:tomcat /opt/tomcat/webapps/ROOT.war
            systemctl reset-failed tomcat 2>/dev/null || true
            systemctl start tomcat
            # Fail the deploy loudly if the app does not actually come up.
            ok=
            for i in $(seq 1 30); do
              if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "200" ]; then ok=1; break; fi
              sleep 3
            done
            if [ -z "$ok" ]; then
              echo "Tomcat did not return 200 after deploy"; tail -40 /opt/tomcat/logs/catalina.out || true; exit 1
            fi
            # A 200 homepage is insufficient: the JSP can render while a stale
            # legacy counter filter leaves both traffic APIs without stores.
            # Validate the uniquely named analytics runtime and both public and
            # protected JSON endpoints before declaring the deployment healthy.
            PUBLIC_TRAFFIC_CHECK=/tmp/scsaid-public-traffic-check.json
            PRIVATE_TRAFFIC_CHECK=/tmp/scsaid-private-traffic-check.json
            PRIVATE_EVENTS_CHECK=/tmp/scsaid-private-events-check.json
            curl -fsS http://127.0.0.1:8080/traffic-stats > "$PUBLIC_TRAFFIC_CHECK"
            set -a
            . "$ANALYTICS_ENV"
            set +a
            curl -fsS --config <(printf 'user = "%s:%s"\n' "$SCSAID_ANALYTICS_USER" "$SCSAID_ANALYTICS_PASSWORD") \
              http://127.0.0.1:8080/country-traffic-stats > "$PRIVATE_TRAFFIC_CHECK"
            curl -fsS --config <(printf 'user = "%s:%s"\n' "$SCSAID_ANALYTICS_USER" "$SCSAID_ANALYTICS_PASSWORD") \
              'http://127.0.0.1:8080/developer-visit-events?limit=1' > "$PRIVATE_EVENTS_CHECK"
            "$SCSAID_PYTHON" -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p.get("runtime")=="visitor-analytics-v2"; assert isinstance(p.get("totalVisits"), int); assert isinstance(p.get("todayVisits"), int)' "$PUBLIC_TRAFFIC_CHECK"
            "$SCSAID_PYTHON" -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p.get("runtime")=="visitor-analytics-v2"; assert "visitAnalytics" in p; assert "allTimeTotal" in p' "$PRIVATE_TRAFFIC_CHECK"
            "$SCSAID_PYTHON" -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p.get("runtime")=="visitor-analytics-v2"; assert "retainedFields" in p; assert "events" in p.get("page", {})' "$PRIVATE_EVENTS_CHECK"
            rm -f "$PUBLIC_TRAFFIC_CHECK" "$PRIVATE_TRAFFIC_CHECK" "$PRIVATE_EVENTS_CHECK"
            echo "Deploy OK: Tomcat serving on 8080"
