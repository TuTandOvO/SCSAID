name: Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: SKINDB
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Build
        run: |
          chmod +x mvnw
          ./mvnw -DskipTests package

      - name: Upload
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "target/*.war"
          target: "/tmp"

      - name: Activate
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            WAR=$(ls /tmp/target/*.war | head -n1)
            # Stop via systemd (and force-kill any stray Catalina) so the next
            # start runs as the 'tomcat' user — keeps webapps/work/temp owned by
            # tomcat and avoids root-owned files that break later restarts.
            systemctl stop tomcat 2>/dev/null || true
            pkill -9 -f catalina 2>/dev/null || true
            # pkill -9 is async — wait for port 8080 to actually be released,
            # otherwise the new JVM hits BindException and dies silently.
            for i in $(seq 1 20); do ss -tln | grep -q ':8080 ' || break; sleep 1; done
            # Clear old app, compiled-JSP cache and stale PID before swapping in.
            rm -rf /opt/tomcat/webapps/ROOT \
                   /opt/tomcat/webapps/ROOT.war \
                   /opt/tomcat/work/Catalina/localhost/ROOT \
                   /opt/tomcat/temp/tomcat.pid
            mv "$WAR" /opt/tomcat/webapps/ROOT.war
            chown tomcat:tomcat /opt/tomcat/webapps/ROOT.war
            systemctl reset-failed tomcat 2>/dev/null || true
            systemctl start tomcat
            # Fail the deploy loudly if the app does not actually come up.
            ok=
            for i in $(seq 1 30); do
              if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "200" ]; then ok=1; break; fi
              sleep 3
            done
            if [ -z "$ok" ]; then
              echo "Tomcat did not return 200 after deploy"; tail -40 /opt/tomcat/logs/catalina.out || true; exit 1
            fi
            echo "Deploy OK: Tomcat serving on 8080"
